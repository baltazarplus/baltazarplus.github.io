<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookly — Booking concept</title><link rel="stylesheet" href="../style.css"><style>.s{cursor:pointer}.s.on{border-color:#7c5cff;background:#1a1530}.slot{padding:10px;border:1px solid #2a3142;border-radius:8px;text-align:center;cursor:pointer}.slot.on{background:#7c5cff;border-color:#7c5cff}.slot.x{opacity:.3;pointer-events:none;text-decoration:line-through}</style></head><body>
<nav><div class="w"><a class="logo" href="#">Bookly<b>.</b></a><div class="l"><a href="../index.html">← Portfolio</a></div></div></nav>
<section><div class="w"><p class="badge">Concept / Self-directed project · mock data</p><h1 style="margin:14px 0">Book your next cut <span class="grad">in 30 seconds</span>.</h1><p class="sub">Online booking for barbershops and clinics: pick a service, choose a pro, grab a slot. No phone calls.</p></div></section>
<section style="padding-top:0"><div class="w g" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
<div class="c"><h3>1. Service</h3><div id="sv" class="g" style="margin-top:12px"></div><h3 style="margin-top:22px">2. Professional</h3><select id="pro"><option>Any available</option><option>Alex R.</option><option>Sam K.</option><option>Dr. Lee</option></select><h3 style="margin-top:22px">3. Date</h3><input type="date" id="dt"></div>
<div class="c"><h3>4. Time</h3><div id="sl" class="g" style="grid-template-columns:repeat(4,1fr);margin-top:12px"></div><h3 style="margin-top:22px">5. Your details</h3><label>Name<input id="nm" placeholder="Jane Doe"></label><label style="display:block;margin-top:10px">Email<input id="em" placeholder="jane@email.com"></label><button class="btn" style="margin-top:18px;width:100%" onclick="book()">Confirm booking</button><div id="ok" style="margin-top:14px"></div></div></div></section>
<script>const S=[["Classic haircut",30,35],["Beard trim",20,20],["Cut + beard",50,50],["Skin consultation",40,80]];let sel=0,slot=null;
sv.innerHTML=S.map((s,i)=>`<div class="c s ${i?'':'on'}" style="padding:14px" onclick="pick(${i},this)"><b>${s[0]}</b><p>${s[1]} min · $${s[2]}</p></div>`).join('');
function pick(i,e){sel=i;document.querySelectorAll('.s').forEach(x=>x.classList.remove('on'));e.classList.add('on')}
dt.valueAsDate=new Date();const T=["09:00","09:30","10:00","10:30","11:00","13:00","13:30","14:00","15:00","15:30","16:00","17:00"];
sl.innerHTML=T.map((t,i)=>`<div class="slot ${i%4==2?'x':''}" onclick="document.querySelectorAll('.slot').forEach(x=>x.classList.remove('on'));this.classList.add('on');slot='${t}'">${t}</div>`).join('');
function book(){if(!slot||!nm.value||!em.value){ok.innerHTML='<p style="color:#f87171">Please pick a time and enter your details.</p>';return}ok.innerHTML=`<div class="c" style="border-color:#10b981"><b>✓ Booked!</b><p>${S[sel][0]} with ${pro.value} on ${dt.value} at ${slot}. Confirmation sent to ${em.value} (demo).</p></div>`}</script></body></html>
