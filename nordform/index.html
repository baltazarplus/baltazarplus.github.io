<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nordform — Storefront concept</title><link rel="stylesheet" href="../style.css"><style>body{background:#f6f3ee;color:#1d1b18}nav{background:#f6f3eecc;border-color:#e4ded4}nav .l a{color:#555}.c{background:#fff;border-color:#e9e3d9}.c p{color:#6b655c}.btn{background:#1d1b18}.f{padding:8px 16px;border-radius:99px;border:1px solid #d6cfc2;background:#fff;cursor:pointer;margin:0 6px 8px 0}.f.on{background:#1d1b18;color:#fff}.im{height:200px;border-radius:12px;margin-bottom:14px}#cart{position:fixed;right:20px;bottom:20px;width:300px;max-width:90vw;display:none}</style></head><body>
<nav><div class="w"><a class="logo" href="#">NORDFORM</a><div class="l"><a href="../index.html">← Portfolio</a><a class="btn" href="#" onclick="cart.style.display=cart.style.display=='block'?'none':'block';return false">Cart (<span id="n">0</span>)</a></div></div></nav>
<section><div class="w"><p class="badge" style="color:#b45309">Concept / Self-directed project · mock data</p><h1 style="margin:14px 0">Scandinavian furniture,<br>made to last.</h1><p class="sub" style="color:#6b655c">Free shipping over $500 · 30-day returns</p></div></section>
<section style="padding-top:0"><div class="w"><div id="fl"></div><div id="gr" class="g g3" style="margin-top:20px"></div></div></section>
<div id="cart" class="c"><h3>Your cart</h3><div id="ci"></div><p style="margin-top:10px"><b>Total: $<span id="tt">0</span></b></p><button class="btn" style="width:100%;margin-top:10px" onclick="alert('Demo checkout — Stripe would be integrated here.')">Checkout</button></div>
<script>const P=[["Oslo Lounge Chair","Seating",549,"#c8a27a"],["Bergen Oak Table","Tables",1290,"#a47148"],["Lund Sofa 3-seat","Seating",1890,"#8a9a8b"],["Aalto Floor Lamp","Lighting",229,"#e2c290"],["Fjord Side Table","Tables",189,"#5b4636"],["Nord Pendant","Lighting",159,"#d9d4c7"]];let c=[],f="All";
function r(){fl.innerHTML=["All","Seating","Tables","Lighting"].map(x=>`<button class="f ${x==f?'on':''}" onclick="f='${x}';r()">${x}</button>`).join('');gr.innerHTML=P.map((p,i)=>[p,i]).filter(([p])=>f=="All"||p[1]==f).map(([p,i])=>`<div class="c"><div class="im" style="background:linear-gradient(135deg,${p[3]},#f6f3ee)"></div><p>${p[1]}</p><h3>${p[0]}</h3><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><b>$${p[2]}</b><button class="btn" onclick="add(${i})">Add to cart</button></div></div>`).join('')}
function add(i){c.push(P[i]);n.textContent=c.length;ci.innerHTML=c.map(p=>`<p>${p[0]} — $${p[2]}</p>`).join('');tt.textContent=c.reduce((a,p)=>a+p[2],0);cart.style.display='block'}r()</script></body></html>
